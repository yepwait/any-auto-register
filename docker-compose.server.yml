# 无头服务器部署，配套 ./Dockerfile.server。
#
# 相对 docker-compose.yml 的差异：
#   - 不映射 8317（CLIProxyAPI 插件端口），避免和宿主机上已有的 CLIProxyAPI 抢端口
#   - 不开 Turnstile Solver，也就不需要 8889 和 shm_size
#   - 端口默认只绑 127.0.0.1，由宿主机的反向代理决定要不要对外暴露

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: any-auto-register:server
    container_name: any-auto-register
    init: true
    restart: unless-stopped
    stop_grace_period: 120s
    # 与完整镜像保持相同的保护；可在 .env 中调整，避免拖垮宿主机。
    mem_limit: ${APP_MEM_LIMIT:-2g}
    memswap_limit: ${APP_MEM_SWAP_LIMIT:-3g}
    cpus: ${APP_CPU_LIMIT:-2.0}
    logging:
      driver: json-file
      options:
        max-size: ${APP_LOG_MAX_SIZE:-10m}
        max-file: "${APP_LOG_MAX_FILES:-3}"
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
      APP_RELOAD: "0"
      APP_RUNTIME_DIR: /runtime
      APP_TASK_WORKERS: ${APP_TASK_WORKERS:-1}
      APP_MAX_ACTIVE_TASKS: ${APP_MAX_ACTIVE_TASKS:-4}
      APP_UPLOAD_WORKERS: ${APP_UPLOAD_WORKERS:-1}
      APP_UPLOAD_QUEUE_SIZE: ${APP_UPLOAD_QUEUE_SIZE:-16}
      APP_TASK_LOG_TAIL_LINES: ${APP_TASK_LOG_TAIL_LINES:-2000}
      APP_TASK_LOG_TAIL_BYTES: ${APP_TASK_LOG_TAIL_BYTES:-1048576}
      APP_ENABLE_SOLVER: ${APP_ENABLE_SOLVER:-0}
      SOLVER_THREADS: ${SOLVER_THREADS:-1}
      DATABASE_URL: sqlite:////runtime/account_manager.db
      # 必须落在挂载卷里，否则每次重建容器都会换密钥，库里的凭据全部作废
      CREDENTIAL_ENCRYPTION_KEY_FILE: /runtime/.secrets/credential_key
    ports:
      - "${APP_PORT_BIND:-127.0.0.1:8000}:8000"
    volumes:
      - ${APP_RUNTIME_BIND:-./data}:/runtime
